<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>迷恋塔罗 · Lego 小手机</title>
  <link rel="stylesheet" href="style.css?v=1.0.2">
  <script type="module" src="app.js?v=1.0.1"></script>
</head>
<body>
  <div class="shell">
    <header class="toolbar">
      <button class="icon-button" id="back" aria-label="返回情侣空间">‹</button>
      <div class="brand"><strong>迷恋塔罗</strong><span id="couple-label">一段只属于你们的星光</span></div>
      <button class="icon-button" id="history" aria-label="查看塔罗历史">☷</button>
      <button class="icon-button" id="settings" aria-label="塔罗设置与备份">⋯</button>
    </header>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <main id="content" tabindex="-1"><div class="empty"><span class="star">✦</span><p>正在打开你们的塔罗手记…</p><p class="muted">若长时间未载入，请返回情侣空间后重新进入。</p></div></main>
    <noscript>请启用 JavaScript 后使用迷恋塔罗。</noscript>
  </div>
  <dialog id="dialog"><form method="dialog"><h2 id="dialog-title"></h2><div id="dialog-body"></div><div class="dialog-actions"><button value="cancel" class="secondary">取消</button><button value="ok" class="primary">确定</button></div></form></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
</body>
</html>
