        <!-- 聊天页面 -->
        <div id="chat-page" class="page">
            <!-- 状态栏 -->
            <div class="status-bar">
                <div class="status-left current-time">02:33</div>
                <div class="status-right">
                    <span class="status-icon" aria-label="网络信号">
                        <svg class="status-icon-svg status-signal-svg" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 18h2v3H3v-3Zm4-4h2v7H7v-7Zm4-4h2v11h-2V10Zm4-4h2v15h-2V6Zm4-3h2v18h-2V3Z" fill="currentColor" opacity=".9"/>
                        </svg>
                    </span>
                    <span class="status-icon" aria-label="电池电量">
                        <svg class="status-icon-svg status-battery-svg" viewBox="0 0 28 14" aria-hidden="true">
                            <rect x="1" y="1" width="23" height="12" rx="3" ry="3" stroke="currentColor" stroke-width="1.5" fill="none" opacity=".95"/>
                            <rect x="25" y="4" width="2" height="6" rx="1" fill="currentColor" opacity=".95"/>
                            <rect class="status-battery-level" x="3.4" y="3.4" width="15.8" height="7.2" rx="2" fill="currentColor" opacity=".85"/>
                        </svg>
                    </span>
                </div>
            </div>

            <!-- 聊天头部 -->
            <div class="chat-header">
                <button class="back-btn" onclick="closeListenTogetherIsland(); navigateTo('wechat');" aria-label="返回微信" title="返回微信">
                    <img src="back-icon.jpg" alt="" class="chat-back-icon" aria-hidden="true">
                </button>
                <details class="chat-heartbeat-monitor chat-heartbeat-monitor--center" id="chat-heartbeat-monitor">
                    <summary class="chat-heartbeat-monitor-summary" title="心跳监控：接收好友回复后自动更新，点击昵称或图标展开查看" aria-label="心跳监控">
                        <span class="chat-heartbeat-monitor-hitarea">
                            <img src="assets/IMG_1773943163887.jpg" alt="" class="chat-heartbeat-monitor-graphic" width="72" height="72" decoding="async">
                            <h1 id="chat-contact-name" class="chat-contact-name-title">张三</h1>
                        </span>
                    </summary>
                    <div class="chat-heartbeat-monitor-panel">
                        <div class="chat-heartbeat-monitor-inner" id="chat-heartbeat-monitor-content">
                            接收好友回复后会自动更新。点击上方昵称或图标展开查看。
                        </div>
                    </div>
                </details>
                <div class="chat-header-buttons">
                    <button class="chat-header-btn" onclick="openChatSettingsWithFriendId()" aria-label="聊天设置" title="聊天设置">
                        <img src="IMG_1773848836036.jpg" alt="" class="chat-header-img" aria-hidden="true">
                    </button>
                </div>
            </div>

            <div class="chat-content">
                <div class="chat-system-message">今天 10:30</div>
                <div class="chat-message other-message">
                    <div class="chat-message-avatar">张</div>
                    <div class="chat-message-bubble">你好，最近怎么样？</div>
                </div>
                <div class="chat-message my-message">
                    <div class="chat-message-bubble">我很好，谢谢关心！</div>
                    <div class="chat-message-avatar">我</div>
                </div>
                <div class="chat-message other-message">
                    <div class="chat-message-avatar">张</div>
                    <div class="chat-message-bubble">那就好，有空一起出来聚聚</div>
                </div>
            </div>

            <div class="message-action-menu" id="message-action-menu">
                <div class="message-action-item" data-action="backtrack">
                    <div class="message-action-icon">↩</div>
                    <div class="message-action-text">回溯</div>
                </div>
                <div class="message-action-item" data-action="quote">
                    <div class="message-action-icon">⋯</div>
                    <div class="message-action-text">引用</div>
                </div>
                <div class="message-action-item" data-action="edit">
                    <div class="message-action-icon">✏️</div>
                    <div class="message-action-text">编辑</div>
                </div>
                <div class="message-action-item" data-action="multiselect">
                    <div class="message-action-icon">✓</div>
                    <div class="message-action-text">多选</div>
                </div>
            </div>

            <div class="modal" id="backtrack-confirm-modal">
                <div class="modal-content backtrack-confirm-modal">
                    <div class="modal-body">
                        <div class="backtrack-confirm-content">
                            <div class="backtrack-confirm-text">回溯后，此消息之后的聊天记录将被删除，是否确定？</div>
                        </div>
                    </div>
                    <div class="modal-footer backtrack-confirm-footer">
                        <button class="backtrack-cancel-btn" onclick="cancelBacktrack()">取消</button>
                        <button class="backtrack-confirm-btn" onclick="confirmBacktrack()">确定</button>
                    </div>
                </div>
            </div>

            <div class="modal" id="edit-message-modal">
                <div class="modal-content edit-message-modal">
                    <div class="modal-header">
                        <h3>编辑消息</h3>
                    </div>
                    <div class="modal-body">
                        <textarea class="edit-message-input" id="edit-message-input" placeholder="编辑消息内容..."></textarea>
                    </div>
                    <div class="modal-footer edit-message-footer">
                        <button class="edit-cancel-btn" onclick="cancelEditMessage()">取消</button>
                        <button class="edit-confirm-btn" onclick="confirmEditMessage()">确定</button>
                    </div>
                </div>
            </div>

            <div class="modal" id="confirm-delete-modal">
                <div class="modal-content confirm-delete-modal">
                    <div class="modal-body">
                        <p class="confirm-delete-text">是否确认删除</p>
                    </div>
                    <div class="modal-footer confirm-delete-footer">
                        <button type="button" class="confirm-delete-cancel-btn" onclick="cancelDelete()">取消</button>
                        <button type="button" class="confirm-delete-confirm-btn" onclick="confirmDelete()">确定</button>
                    </div>
                </div>
            </div>

            <div class="modal" id="forward-friends-modal">
                <div class="modal-content forward-friends-modal-content">
                    <div class="modal-header forward-friends-header">
                        <h3>转发给</h3>
                    </div>
                    <div class="modal-body forward-friends-body">
                        <p class="forward-friends-hint" id="forward-friends-hint"></p>
                        <div class="forward-friends-list" id="forward-friends-list"></div>
                        <div class="forward-friends-empty" id="forward-friends-empty" style="display:none;">暂无其他可转发的好友</div>
                    </div>
                    <div class="modal-footer forward-friends-footer">
                        <button type="button" class="forward-friends-cancel-btn" onclick="cancelForwardFriendsModal()">取消</button>
                        <button type="button" class="forward-friends-send-btn" onclick="confirmForwardToSelectedFriends()">发送</button>
                    </div>
                </div>
            </div>

            <div class="chat-multiselect-bar" id="chat-multiselect-bar">
                <div class="multiselect-info">
                    <span id="selected-count">已选择 0 条消息</span>
                </div>
                <div class="multiselect-actions">
                    <button type="button" class="multiselect-btn forward-btn" title="逐条转发" onclick="forwardSelectedMessages()">转发</button>
                    <button type="button" class="multiselect-btn favorite-btn" title="收藏" onclick="favoriteSelectedMessages()">收藏</button>
                    <button type="button" class="multiselect-btn delete-btn" title="删除" onclick="deleteSelectedMessages()">删除</button>
                    <button type="button" class="multiselect-btn cancel-btn" title="取消" onclick="exitMultiselectMode()">取消</button>
                </div>
            </div>

            <div class="chat-quote-frame" id="chat-quote-frame" title="点击查看引用原文">
                <div class="chat-quote-header">
                    <span class="chat-quote-name" id="chat-quote-name"></span>
                    <button class="chat-quote-close" onclick="closeQuote()">×</button>
                </div>
                <div class="chat-quote-content" id="chat-quote-content"></div>
            </div>

            <div class="modal chat-quote-detail-modal" id="chat-quote-detail-modal" onclick="if(event.target.id==='chat-quote-detail-modal') closeChatQuoteDetailModal()">
                <div class="modal-content chat-quote-detail-content">
                    <div class="chat-quote-detail-header">
                        <span class="chat-quote-detail-name" id="chat-quote-detail-name"></span>
                        <button type="button" class="chat-quote-detail-close" onclick="closeChatQuoteDetailModal()">×</button>
                    </div>
                    <div class="chat-quote-detail-body" id="chat-quote-detail-content"></div>
                </div>
            </div>

            <button type="button" class="offline-float-btn" id="offline-float-btn" title="线下模式" onclick="openOfflineModeModal()" style="display:none;">
                <img src="IMG_1773943493623.jpg" alt="线下模式" class="offline-float-btn-img">
            </button>

            <div class="chat-input-area">
                <button class="chat-function-btn receive-btn" title="接收" aria-label="接收回复"></button>
                <button class="chat-function-btn emoji-btn" title="表情" aria-label="打开表情" onclick="toggleEmojiPanel()"></button>
                <input type="text" class="chat-input" id="chat-input" placeholder="输入消息...">
                <button class="chat-function-btn more-btn" title="更多" aria-label="打开更多功能" onclick="toggleMorePanel()"></button>
                <button class="chat-function-btn send-btn" title="发送" aria-label="发送消息" onclick="sendMessage()"></button>
            </div>

            <!-- 聊天模态框片段挂载点 -->
            <div id="chat-modals-fragment-anchor"></div>
        </div>
