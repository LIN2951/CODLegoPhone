        <!-- 微信页面 -->
        <div id="wechat-page" class="page">
            <!-- 状态栏 -->
            <div class="status-bar">
                <div class="status-left current-time">02:33</div>
                <div class="status-right">
                    <span class="status-icon" aria-label="网络信号">
                        <svg class="status-icon-svg status-signal-svg" viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M3 18h2v3H3v-3Zm4-4h2v7H7v-7Zm4-4h2v11h-2V10Zm4-4h2v15h-2V6Zm4-3h2v18h-2V3Z" fill="currentColor" opacity=".9"/>
                        </svg>
                    </span>
                    <span class="status-icon" aria-label="电池电量">
                        <svg class="status-icon-svg status-battery-svg" viewBox="0 0 28 14" aria-hidden="true">
                            <rect x="1" y="1" width="23" height="12" rx="3" ry="3" stroke="currentColor" stroke-width="1.5" fill="none" opacity=".95"/>
                            <rect x="25" y="4" width="2" height="6" rx="1" fill="currentColor" opacity=".95"/>
                            <rect class="status-battery-level" x="3.4" y="3.4" width="15.8" height="7.2" rx="2" fill="currentColor" opacity=".85"/>
                        </svg>
                    </span>
                </div>
            </div>

            <!-- 微信头部 -->
            <div class="wechat-header">
                <button class="wechat-back-btn" onclick="navigateTo('home')" aria-label="返回主界面" title="返回主界面">
                    <svg class="wechat-line-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 4-8 8 8 8"/></svg>
                </button>
                <h1>微信</h1>
                <div class="wechat-header-buttons">
                    <button type="button" class="wechat-header-btn" onclick="showWechatSearch()" aria-label="搜索会话" title="搜索会话">
                        <svg class="wechat-line-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></svg>
                    </button>
                    <button type="button" class="wechat-header-btn" id="wechat-add-trigger" onclick="toggleWechatAddMenu()" aria-label="添加" aria-controls="wechat-add-menu" aria-expanded="false" title="添加">
                        <svg class="wechat-line-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/></svg>
                    </button>
                </div>
            </div>

            <!-- 添加菜单 -->
            <div class="wechat-add-menu" id="wechat-add-menu">
                <button type="button" class="wechat-add-menu-item" onclick="closeWechatAddMenu(); openCreateGroupChatModal()">发起群聊</button>
                <button type="button" class="wechat-add-menu-item" onclick="closeWechatAddMenu(); openAddFriendModal()">添加好友</button>
            </div>

            <!-- 发起群聊：选择好友（至少2位） -->
            <div class="modal" id="create-groupchat-modal">
                <div class="modal-content forward-friends-modal-content">
                    <div class="modal-header forward-friends-header">
                        <h3>发起群聊</h3>
                    </div>
                    <div class="modal-body forward-friends-body">
                        <p class="forward-friends-hint" id="create-groupchat-hint">请选择至少 2 位好友</p>
                        <div class="forward-friends-list" id="create-groupchat-friends-list"></div>
                        <div class="forward-friends-empty" id="create-groupchat-empty" style="display:none;">暂无可选好友</div>
                    </div>
                    <div class="modal-footer forward-friends-footer">
                        <button type="button" class="forward-friends-cancel-btn" onclick="cancelCreateGroupChatModal()">取消</button>
                        <button type="button" class="forward-friends-send-btn" id="create-groupchat-confirm-btn" onclick="confirmCreateGroupChat()">确定</button>
                    </div>
                </div>
            </div>

            <div class="wechat-search-bar" id="wechat-search-bar" hidden>
                <label class="wechat-search-field" for="wechat-conversation-search">
                    <svg class="wechat-line-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></svg>
                    <input type="search" id="wechat-conversation-search" placeholder="搜索会话名称或最近消息" aria-label="搜索会话名称或最近消息" autocomplete="off" oninput="filterWechatConversations(this.value)" onkeydown="if(event.key === 'Escape') closeWechatSearch()">
                </label>
                <button type="button" class="wechat-search-cancel" onclick="closeWechatSearch()">取消</button>
            </div>
            <p class="wechat-search-empty" id="wechat-search-empty" hidden role="status">未找到匹配的会话</p>

            <!-- 微信聊天列表 -->
            <div class="wechat-chat-list">
            </div>

            <!-- 底部导航 -->
            <nav class="wechat-bottom-nav" aria-label="微信导航">
                <button type="button" class="wechat-nav-item active" data-wechat-tab="messages" aria-current="page" onclick="showWechatMessages()">
                    <span class="wechat-nav-icon"><svg class="wechat-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="wechat-nav-outline" d="M21 10.8c0 4.3-4 7.8-9 7.8-1.1 0-2.2-.2-3.2-.5L4 20l1.1-4.1A7.2 7.2 0 0 1 3 10.8C3 6.5 7 3 12 3s9 3.5 9 7.8Z"/><path class="wechat-nav-fill" fill="currentColor" stroke="none" d="M12 2C6.5 2 2 5.9 2 10.8c0 2.1.9 4.2 2.5 5.7L3.2 21l5.5-2c1.1.3 2.2.5 3.3.5 5.5 0 10-3.9 10-8.7S17.5 2 12 2Z"/></svg></span>
                    <span class="wechat-nav-text">微信</span>
                </button>
                <button type="button" class="wechat-nav-item" data-wechat-tab="discover" onclick="showWechatDiscover()">
                    <span class="wechat-nav-icon"><svg class="wechat-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><g class="wechat-nav-outline"><circle cx="12" cy="12" r="9"/><path d="m16.4 7.6-2.8 6-6 2.8 2.8-6 6-2.8Z"/></g><g class="wechat-nav-fill" fill="currentColor" stroke="none"><path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm5 5-3.2 6.8L7 17l3.2-6.8L17 7Z"/></g></svg></span>
                    <span class="wechat-nav-text">发现</span>
                </button>
                <button type="button" class="wechat-nav-item" data-wechat-tab="me" onclick="showWechatMe()">
                    <span class="wechat-nav-icon"><svg class="wechat-nav-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="wechat-nav-outline" d="M12 3c-2.6 0-4 2.2-4 5 0 2.2.8 4.1 2.1 5.2-.3 1.5-1.9 2.2-4 3.4C4.5 17.4 4 18.4 4 20h16c0-1.6-.5-2.6-2.1-3.4-2.1-1.2-3.7-1.9-4-3.4C15.2 12.1 16 10.2 16 8c0-2.8-1.4-5-4-5Z"/><path class="wechat-nav-fill" fill="currentColor" stroke="none" d="M12 2c-2.8 0-4.5 2.3-4.5 5.7 0 2 .7 3.8 1.9 4.9-.3 1.2-1.6 1.8-3.8 3-2.1 1.1-3.1 2.5-3.1 4.4v1h19v-1c0-1.9-1-3.3-3.1-4.4-2.2-1.2-3.5-1.8-3.8-3 1.2-1.1 1.9-2.9 1.9-4.9C16.5 4.3 14.8 2 12 2Z"/></svg></span>
                    <span class="wechat-nav-text">我</span>
                </button>
            </nav>
        </div>
